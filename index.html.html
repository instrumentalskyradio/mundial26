<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuenta Regresiva Mundial 2026</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1574629810360-7efbbe195018?auto=format&fit=crop&q=80&w=1000') no-repeat center center fixed;
            background-size: cover;
            color: white;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        header { padding: 20px; }
        h1 { font-size: 2.5rem; margin-bottom: 10px; text-transform: uppercase; color: #fff; }
        h2 { font-weight: 300; letter-spacing: 2px; margin: 0; }
        
        #countdown {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.15);
            padding: 15px;
            border-radius: 12px;
            min-width: 90px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .time-box span { font-size: 2.5rem; display: block; font-weight: bold; }
        .label { font-size: 0.8rem; text-transform: uppercase; color: #ffd700; margin-top: 5px; }

        /* Contenedor del Video Responsive */
        .video-container {
            margin: 20px auto;
            width: 90%;
            max-width: 650px;
        }
        
        .video-aspect-ratio {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .video-aspect-ratio iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        footer {
            margin-top: auto;
            padding: 25px;
            font-size: 1rem;
            background: rgba(0,0,0,0.8);
        }

        .brand { color: #ffd700; font-weight: bold; }

        @media (max-width: 600px) {
            h1 { font-size: 1.6rem; }
            h2 { font-size: 1.1rem; }
            .time-box { min-width: 70px; padding: 10px; }
            .time-box span { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <header>
        <h2>CUENTA REGRESIVA</h2>
        <h1>Copa Mundial de la FIFA 2026</h1>
        <p>M&eacutexico * Estados Unidos * Canad&aacute</p>
    </header>

    <div id="countdown">
        <div class="time-box"><span id="days">00</span><div class="label">D&iacuteas</div></div>
        <div class="time-box"><span id="hours">00</span><div class="label">Horas</div></div>
        <div class="time-box"><span id="minutes">00</span><div class="label">Min</div></div>
        <div class="time-box"><span id="seconds">00</span><div class="label">Seg</div></div>
    </div>

    <!-- Sección del Video -->
    <div class="video-container">
        <div class="video-aspect-ratio">
            <iframe src="https://www.youtube.com/embed/iPMCj28XwNA?si=ANDqTP475-ALl5Rv" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
    </div>

    <footer>
        <p>Fecha de inicio: <span class="brand">11 de Junio de 2026</span></p>
        <p>Administrado por: <span class="brand">El Socio</span></p>
    </footer>

    <script>
        const countdownDate = new Date("June 11, 2026 00:00:00").getTime();

        const x = setInterval(function() {
            const now = new Date().getTime();
            const distance = countdownDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerHTML = days;
            document.getElementById("hours").innerHTML = hours.toString().padStart(2, '0');
            document.getElementById("minutes").innerHTML = minutes.toString().padStart(2, '0');
            document.getElementById("seconds").innerHTML = seconds.toString().padStart(2, '0');

            if (distance < 0) {
                clearInterval(x);
                document.getElementById("countdown").innerHTML = "<h3>¡HA COMENZADO EL SUEÑO MUNDIALISTA!</h3>";
            }
        }, 1000);
    </script>

</body>
</html>
